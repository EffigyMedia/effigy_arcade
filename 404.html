<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>EFFIGY ARCADE — wrong door</title>
<style>
  :root{ --ink:#f6f1e8; --dim:#9a93a6; --bg:#06050a; --accent:#ff8a3d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:grid; place-items:center; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    text-align:center;
  }
  .card{max-width:34rem}
  h1{font-size:clamp(28px,9vw,44px); letter-spacing:.14em; margin:0 0 4px; color:var(--accent)}
  h2{font-size:13px; letter-spacing:.34em; color:var(--dim); font-weight:400; margin:0 0 26px}
  p{color:var(--dim); margin:0 0 20px}
  a.go{
    display:inline-block; padding:13px 26px; text-decoration:none;
    color:var(--bg); background:var(--accent); font-weight:700;
    letter-spacing:.16em; border-radius:3px;
  }
  .why{margin-top:26px; font-size:13px; color:#6d6779}
</style>
</head>
<body>
  <div class="card">
    <h1>WRONG DOOR</h1>
    <h2>EFFIGY ARCADE</h2>
    <p>There is no machine at that address. The cabinets moved into shelf folders, so a link
       saved before that will not open.</p>
    <p><a class="go" id="go" href="/">OPEN THE ARCADE</a></p>
    <div class="why">Taking you there automatically…</div>
  </div>
<script>
/* THE WAY BACK HAS TO BE COMPUTED, NOT WRITTEN DOWN.
   This page is served for ANY missing path under the site, so a relative URL in it resolves
   against the path that was REQUESTED rather than against this file. `../index.html` from
   /effigy-arcade/games/ge/gone.html lands somewhere different than from /effigy-arcade/gone.html.

   The rule instead: on a github.io host a project site's root is the first path segment;
   anywhere else the site is at the root. That works for this host and for a move to one that
   serves at the root, and it names no repository, so nothing here goes stale on a rename. */
(function(){
  var seg = location.pathname.split('/').filter(Boolean);
  var home = (/\.github\.io$/i.test(location.hostname) && seg.length) ? '/' + seg[0] + '/' : '/';
  document.getElementById('go').href = home;
  /* `replace`, not `assign`: the dead address must not go into history, or Back walks
     straight into it again. */
  setTimeout(function(){ location.replace(home); }, 1200);
})();
</script>
</body>
</html>
